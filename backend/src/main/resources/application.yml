# ═══════════════════════════════════════════════════════════════════════
# Delivery Multinivel — Configuración Principal
# ═══════════════════════════════════════════════════════════════════════

spring:
  application:
    name: delivery-multinivel

  # ── PostgreSQL + PostGIS ──────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:delivery_db}?currentSchema=bmcp_app,public}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:delivery_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:delivery_pass}}
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ──────────────────────────────────────────────────
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate          # Flyway gestiona el esquema
    show-sql: false
    properties:
      hibernate:
        default_schema: bmcp_app
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Flyway ───────────────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true
    default-schema: bmcp_app
    schemas: bmcp_app
    locations: classpath:db/migration

  # ── Redis (Caché volátil, GPS Tracking con TTL 15s, Rate Limiting y Keyspace Events) ──
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms
      ssl:
        enabled: ${REDIS_SSL:false}

  # ── Jackson ──────────────────────────────────────────────────────────
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ── Seguridad JWT ────────────────────────────────────────────────────
security:
  jwt:
    secret-key: ${JWT_SECRET:CAMBIAR_EN_PRODUCCION_clave_secreta_256_bits_minimo}
    expiration-ms: 86400000       # 24 horas
    refresh-expiration-ms: 604800000  # 7 días

# ── Servidor ─────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

# ── OpenAPI / Swagger ────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ── Logging ──────────────────────────────────────────────────────────
logging:
  level:
    com.delivery: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
